<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feliz Cumpleaños 🎂</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background: #0d0614;
      color: white;
    }


    /* =========================================
       PANTALLA INICIAL
    ========================================= */

    #start-screen {

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 25px;

      z-index: 10;

      overflow: hidden;

      background-image:
        linear-gradient(
          rgba(5, 5, 15, 0.45),
          rgba(5, 5, 15, 0.70)
        ),
        url("jos/wp12860796.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      transition:
        opacity 1s ease,
        visibility 1s;
    }


    /* Efecto de luz */

    #start-screen::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,0.08),
          transparent 60%
        );

      pointer-events: none;
    }


    /* =========================================
       CONTENIDO INICIAL
    ========================================= */

    .contenido-inicio {

      position: relative;

      z-index: 2;

      width: 100%;

      max-width: 650px;

      padding: 30px 20px;

      animation:
        aparecer 1.5s ease;
    }


    @keyframes aparecer {

      from {

        opacity: 0;

        transform:
          translateY(30px)
          scale(0.95);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* =========================================
       TITULO INICIAL
    ========================================= */

    #start-screen h1 {

      font-family:
        'Press Start 2P',
        cursive;

      font-size:
        clamp(
          1.5rem,
          5vw,
          3rem
        );

      line-height: 1.6;

      color: white;

      text-shadow:

        3px 3px 0 #000,

        0 0 10px
        rgba(255,255,255,0.8),

        0 0 25px
        rgba(255,193,7,0.6);

      margin-bottom: 30px;
    }


    /* =========================================
       PREGUNTA
    ========================================= */

    #start-screen p {

      font-size:
        clamp(
          1.1rem,
          4vw,
          1.6rem
        );

      font-weight: 600;

      margin-bottom: 35px;

      color: white;

      text-shadow:
        2px 2px 5px #000;
    }


    /* =========================================
       BOTONES INICIALES
    ========================================= */

    .btn-container {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 18px;

      position: relative;

      min-height: 70px;

      width: 100%;
    }


    .btn {

      font-family:
        'Press Start 2P',
        cursive;

      padding:
        14px 22px;

      font-size:
        clamp(
          0.65rem,
          2.5vw,
          0.9rem
        );

      border:
        3px solid white;

      border-radius: 12px;

      color: white;

      cursor: pointer;

      box-shadow:
        0 5px 0
        rgba(0,0,0,0.8);

      transition:
        transform 0.15s,
        background-color 0.2s;

      min-width: 140px;
    }


    .btn:active {

      transform:
        translateY(4px);

      box-shadow:
        0 1px 0
        rgba(0,0,0,0.8);
    }


    /* EMPEZAR */

    .btn-empezar {

      background:
        linear-gradient(
          135deg,
          #d4af37,
          #f6d365
        );

      color: #17100a;
    }


    .btn-empezar:hover {

      transform:
        scale(1.05);

      background:
        linear-gradient(
          135deg,
          #f6d365,
          #d4af37
        );
    }


    /* DENEGAR */

    .btn-denegar {

      background:
        linear-gradient(
          135deg,
          #8b0000,
          #e53935
        );

      position: relative;
    }


    /* =========================================
       PANTALLA UNIVERSO
    ========================================= */

    #universe-screen {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background:
        linear-gradient(
          to bottom,
          #023a5b 0%,
          #090119 60%,
          #152f4a 100%
        );

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 1.5s ease;

      overflow: hidden;

      text-align: center;

      padding: 20px;
    }


    canvas {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 1;
    }


    /* =========================================
       TITULO UNIVERSO
    ========================================= */

    .title-universe {

      position: relative;

      z-index: 5;

      font-family:
        'Quicksand',
        sans-serif;

      font-size:
        clamp(
          1.7rem,
          6vw,
          3.5rem
        );

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;

      text-align: center;

      padding: 0 20px;

      margin-bottom: 45px;

      text-shadow:

        0 0 10px
        rgba(3, 6, 28, 0.8),

        0 0 20px
        rgba(12, 0, 0, 0.5),

        0 0 30px
        rgba(14, 1, 14, 0.6);

      animation:
        pulse 3s infinite alternate;
    }


    @keyframes pulse {

      0% {

        transform:
          scale(0.98);

        opacity: 0.9;
      }

      100% {

        transform:
          scale(1.03);

        opacity: 1;
      }

    }


    /* =========================================
       BOTÓN DESCUBRE TU SORPRESA
    ========================================= */

    .btn-sorpresa {

      position: relative;

      z-index: 6;

      font-family:
        'Quicksand',
        sans-serif;

      font-size:
        clamp(
          1rem,
          4vw,
          1.3rem
        );

      font-weight: 700;

      padding:
        16px 28px;

      border: 2px solid #110102;

      border-radius: 50px;

      background:
        linear-gradient(
          135deg,
          #9a9cbc,
          #c7c3df
        );

      color: #1b1025;

      cursor: pointer;

      box-shadow:

        0 0 15px
        rgba(121, 168, 211, 0.6),

        0 8px 20px
        rgba(0,0,0,0.5);

      transition:
        transform 0.3s,
        box-shadow 0.3s;
    }


    .btn-sorpresa:hover {

      transform:
        scale(1.08);

      box-shadow:

        0 0 30px
        rgba(135, 145, 219, 0.9),

        0 10px 25px
        rgba(0,0,0,0.6);
    }


    .btn-sorpresa:active {

      transform:
        scale(0.98);
    }


    /* =========================================
       TRANSICIONES
    ========================================= */

    .fade-out {

      opacity: 0 !important;

      visibility: hidden !important;
    }


    .fade-in {

      opacity: 1 !important;

      visibility: visible !important;
    }


    /* =========================================
       CELULAR
    ========================================= */

    @media (max-width: 600px) {

      #start-screen {

        padding: 15px;

        background-position:
          center center;
      }


      .contenido-inicio {

        padding:
          20px 10px;
      }


      #start-screen h1 {

        font-size:
          clamp(
            1.2rem,
            7vw,
            2rem
          );

        line-height: 1.5;

        margin-bottom: 25px;
      }


      #start-screen p {

        font-size:
          1.1rem;

        margin-bottom: 28px;
      }


      .btn-container {

        gap: 12px;
      }


      .btn {

        min-width: 125px;

        padding:
          13px 12px;

        font-size:
          0.65rem;
      }


      .title-universe {

        font-size:
          1.7rem;

        line-height: 1.4;

        margin-bottom: 35px;
      }


      .btn-sorpresa {

        font-size:
          0.95rem;

        padding:
          15px 22px;
      }

    }


    /* =========================================
       CELULARES PEQUEÑOS
    ========================================= */

    @media (max-width: 380px) {

      .btn-container {

        flex-direction: column;

        gap: 15px;
      }


      .btn {

        width: 150px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       PANTALLA INICIAL
  ========================================== -->

  <div id="start-screen">

    <div class="contenido-inicio">

      <h1>
        FELIZ<br>
        CUMPLEAÑOS 🎂
      </h1>

      <p>
        ¿Quieres ver tu regalo?
      </p>


      <div class="btn-container">

        <button
          class="btn btn-empezar"
          onclick="startExperience()">

          EMPEZAR

        </button>


        <button
          class="btn btn-denegar"
          id="no-btn"
          onmouseover="moveButton()"
          ontouchstart="moveButton()">

          DENEGAR

        </button>

      </div>

    </div>

  </div>


  <!-- =========================================
       PANTALLA UNIVERSO
  ========================================== -->

  <div id="universe-screen">

    <canvas id="canvas"></canvas>


    <h1 class="title-universe">

   Todos necesitamos que nos sujeten cuando nuestras piezas están a
    punto de caer.🫀

    </h1>


    <!-- ESTE ES EL ÚNICO BOTÓN -->

    <button
      class="btn-sorpresa"
      onclick="irAFelizCumpleanos()">

      ¡Hay algo especial para ti!

    </button>

  </div>


  <script>


    /* =========================================
       BOTÓN DENEGAR
    ========================================= */

    function moveButton() {

      const btn =
        document.getElementById(
          "no-btn"
        );


      const maxX =
        window.innerWidth / 2 - 100;


      const maxY =
        window.innerHeight / 2 - 80;


      const x =
        (Math.random() * maxX * 2)
        - maxX;


      const y =
        (Math.random() * maxY * 2)
        - maxY;


      btn.style.transform =
        `translate(${x}px, ${y}px)`;
    }



    /* =========================================
       PASAR AL UNIVERSO
    ========================================= */

    function startExperience() {

      const start =
        document.getElementById(
          "start-screen"
        );


      const universe =
        document.getElementById(
          "universe-screen"
        );


      start.classList.add(
        "fade-out"
      );


      universe.classList.add(
        "fade-in"
      );


      initCanvas();

    }



    /* =========================================
       IR A FELIZ CUMPLEAÑOS
    ========================================= */

    function irAFelizCumpleanos() {

      window.location.href =
        "feliz_cumpleaños.html";

    }



    /* =========================================
       CANVAS
    ========================================= */

    function initCanvas() {

      const canvas =
        document.getElementById(
          "canvas"
        );


      const ctx =
        canvas.getContext("2d");


      let width =
        canvas.width =
        window.innerWidth;


      let height =
        canvas.height =
        window.innerHeight;


      window.addEventListener(
        "resize",
        () => {

          width =
            canvas.width =
            window.innerWidth;


          height =
            canvas.height =
            window.innerHeight;

        }
      );


      /* =====================================
         ESTRELLAS
      ===================================== */

      const stars =
        Array.from(
          { length: 150 },
          () => ({

            x:
              Math.random() * width,

            y:
              Math.random() * height,

            radius:
              Math.random() * 1.5,

            alpha:
              Math.random()

          })
        );


      /* =====================================
         ESTRELLAS FUGACES
      ===================================== */

      class ShootingStar {

        constructor() {

          this.reset();

        }


        reset() {

          this.x =
            Math.random() * width;

          this.y = 0;

          this.length =
            Math.random() * 80 + 40;

          this.speed =
            Math.random() * 4 + 4;

          this.angle =
            Math.PI / 4;

          this.opacity = 1;

        }


        update() {

          this.x +=
            Math.cos(this.angle)
            * this.speed;


          this.y +=
            Math.sin(this.angle)
            * this.speed;


          this.opacity -= 0.01;


          if (
            this.opacity <= 0 ||
            this.x > width ||
            this.y > height
          ) {

            this.reset();

          }

        }


        draw() {

          ctx.beginPath();


          ctx.moveTo(
            this.x,
            this.y
          );


          ctx.lineTo(

            this.x -
            Math.cos(this.angle)
            * this.length,

            this.y -
            Math.sin(this.angle)
            * this.length

          );


          ctx.strokeStyle =
            `rgba(
              255,
              255,
              255,
              ${this.opacity}
            )`;


          ctx.lineWidth = 1.5;


          ctx.stroke();

        }

      }



      /* =====================================
         PARTICULAS
      ===================================== */

      class Particle {

        constructor(
          x,
          y,
          color
        ) {

          this.x = x;

          this.y = y;

          this.color = color;


          const angle =
            Math.random()
            * Math.PI
            * 2;


          const speed =
            Math.random() * 4 + 1;


          this.vx =
            Math.cos(angle)
            * speed;


          this.vy =
            Math.sin(angle)
            * speed;


          this.alpha = 1;

          this.friction = 0.98;

          this.gravity = 0.05;

        }


        update() {

          this.vx *=
            this.friction;


          this.vy *=
            this.friction;


          this.vy +=
            this.gravity;


          this.x +=
            this.vx;


          this.y +=
            this.vy;


          this.alpha -=
            0.015;

        }


        draw() {

          ctx.save();


          ctx.globalAlpha =
            this.alpha;


          ctx.beginPath();


          ctx.arc(
            this.x,
            this.y,
            2,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            this.color;


          ctx.fill();


          ctx.restore();

        }

      }



      /* =====================================
         FUEGOS ARTIFICIALES
      ===================================== */

      class Firework {

        constructor() {

          this.x =
            Math.random()
            * (width - 200)
            + 100;


          this.y = height;


          this.targetY =
            Math.random()
            * (height * 0.4)
            + height * 0.1;


          this.speed =
            Math.random() * 3 + 3;


          this.particles = [];


          this.exploded = false;


          this.color =
            `hsl(
              ${Math.random() * 60 + 10},
              100%,
              65%
            )`;

        }


        update() {

          if (!this.exploded) {

            this.y -=
              this.speed;


            if (
              this.y <=
              this.targetY
            ) {

              this.exploded = true;


              for (
                let i = 0;
                i < 50;
                i++
              ) {

                this.particles.push(

                  new Particle(
                    this.x,
                    this.y,
                    this.color
                  )

                );

              }

            }

          }

          else {

            this.particles
              .forEach(
                (p, index) => {

                  p.update();


                  if (
                    p.alpha <= 0
                  ) {

                    this.particles
                      .splice(
                        index,
                        1
                      );

                  }

                }
              );

          }

        }


        draw() {

          if (!this.exploded) {

            ctx.beginPath();


            ctx.arc(
              this.x,
              this.y,
              3,
              0,
              Math.PI * 2
            );


            ctx.fillStyle =
              this.color;


            ctx.fill();

          }

          else {

            this.particles
              .forEach(
                p => p.draw()
              );

          }

        }

      }



      const shootingStars = [

        new ShootingStar(),

        new ShootingStar()

      ];


      let fireworks = [];



      /* =====================================
         ANIMACIÓN
      ===================================== */

      function animate() {

        ctx.fillStyle =
          "rgba(13, 6, 20, 0.2)";


        ctx.fillRect(
          0,
          0,
          width,
          height
        );


        /* ESTRELLAS */

        stars.forEach(
          s => {

            ctx.fillStyle =
              `rgba(
                255,
                255,
                255,
                ${s.alpha}
              )`;


            ctx.fillRect(
              s.x,
              s.y,
              s.radius,
              s.radius
            );

          }
        );


        /* ESTRELLAS FUGACES */

        shootingStars.forEach(
          st => {

            st.update();

            st.draw();

          }
        );


        /* FUEGOS ARTIFICIALES */

        if (
          Math.random() < 0.03
        ) {

          fireworks.push(
            new Firework()
          );

        }


        fireworks.forEach(
          (fw, index) => {

            fw.update();

            fw.draw();


            if (
              fw.exploded &&
              fw.particles.length === 0
            ) {

              fireworks.splice(
                index,
                1
              );

            }

          }
        );


        requestAnimationFrame(
          animate
        );

      }


      animate();

    }

  </script>

</body>
</html>
